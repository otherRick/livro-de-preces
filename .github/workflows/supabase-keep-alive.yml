name: Keep Supabase active

on:
  schedule:
    # GitHub Actions schedules use UTC. Runs at midnight UTC on every third day of a month.
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Call Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -o pipefail

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY must be configured as repository secrets." >&2
            exit 1
          fi

          status_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/")

          if [[ "$status_code" != "200" ]]; then
            echo "Supabase keep-alive failed: expected HTTP 200 from the REST API, got HTTP $status_code." >&2
            exit 1
          fi

          echo "Supabase REST API responded with HTTP 200."
